services:
  - type: web
    name: eulr-meeting-bot
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: HEADLESS
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: eulr-storage
      mountPath: /app/data
      sizeGB: 5
