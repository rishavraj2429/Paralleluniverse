name: Enterprise CI/CD Pipeline (AWS EKS & SonarQube)

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Lint & Test Microservices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 for Spring Boot
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Test Core Orchestrator
        run: |
          cd services/core-orchestrator
          mvn clean test

      - name: Setup Python for LangGraph & RAG
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Test AI RAG Service
        run: |
          cd services/ai-rag-service
          pip install -r requirements.txt
          python -c "import fastapi, langchain, langgraph; print('AI Microservice Dependencies Verified')"

  docker-scan-and-deploy:
    name: Docker Build, Trivy Scan & EKS Deploy
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via IAM OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsDeploymentRole

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Scan Docker Images
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: eulr-core-orchestrator:latest
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Deploy to AWS EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name eulr-production-eks
          kubectl apply -f infra/k8s/eks-deployment.yaml
